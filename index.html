    <style>
      /* Boot splash: shown until React mounts, then replaced by the app root. */
      html, body { margin: 0; height: 100%; background: #14210c; }
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #f3e3c6;
      }
      #boot svg { width: 84px; height: 84px; animation: boot-pop 1.6s ease-in-out infinite; }
      #boot b { font-size: 15px; letter-spacing: 2.4px; text-transform: uppercase; color: #ffe524; }
      #boot span { font-size: 13px; opacity: .7; }
      @keyframes boot-pop { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-6px) } }
      @media (prefers-reduced-motion: reduce) { #boot svg { animation: none } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">

  <path d="M43.6 31.3h3.6l4 5.5h-7.6z" fill="#7ea6c9" stroke="#140c04" stroke-width="1.7"/>
  <circle cx="18.5" cy="43" r="5.2" fill="#2b1b08" stroke="#140c04" stroke-width="2.2"/>
  <circle cx="46" cy="43" r="5.2" fill="#2b1b08" stroke="#140c04" stroke-width="2.2"/>
